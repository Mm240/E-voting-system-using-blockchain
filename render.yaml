services:
  - type: web
    name: smart-voting-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: smart-voting-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: ADMIN_WALLET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: WEB3_PROVIDER
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
  - type: web
    name: smart-voting-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
databases:
  - name: smart-voting-db
    plan: basic-256mb
